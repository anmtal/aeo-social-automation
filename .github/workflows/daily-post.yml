name: The AEO Loop scheduler

# Posts whatever is due per the manifest. The noon carousel must LAND at 12:00 ET.
# GitHub's scheduler only ever starts runs LATE (often 1-2h — that's why it was
# landing ~1:45pm), so we FIRE EARLY and then sleep to exactly noon inside the job
# (automation/noon_gate.py). The post lands on the hour no matter when GitHub starts.
#
# Cron fires :10/:40 across 14-17 UTC — that spans ~2h before to ~2h after noon ET
# in BOTH DST offsets (EDT noon = 16:00 UTC, EST noon = 17:00 UTC). Each fire either
# sleeps-to-noon, skips (too early), or posts-now (already past noon). A
# workflow_dispatch (e.g. a minute-accurate external trigger) bypasses the gate.
on:
  schedule:
    - cron: "10,40 14,15,16,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "due (default) | check | <slug to post now>"
        required: false
        default: "due"

permissions:
  contents: write

# Only ever ONE publish run at a time. cancel-in-progress must stay false: killing
# a run mid-publish can leave a reel live but unrecorded, which re-posts later.
concurrency:
  group: aeo-loop-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150            # a scheduled run may sleep up to ~2h to hit noon
    steps:
      # ref: pins to the BRANCH HEAD, not the trigger SHA. A run queued behind the
      # concurrency guard was triggered before the run ahead of it recorded its post,
      # so a default checkout would hand it a stale posted.json and it would publish
      # the same reel again.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      # Land scheduled runs at exactly 12:00 ET: sleep to noon, skip if too early,
      # or post now if already past noon. Manual/external dispatch bypasses this.
      - name: Gate to noon (scheduled runs only)
        id: gate
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if python automation/noon_gate.py; then
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            if [ "$rc" = "2" ]; then echo "post=false" >> "$GITHUB_OUTPUT";
            else echo "post=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Re-read the posted log at the last possible moment
        run: |
          git fetch origin ${{ github.event.repository.default_branch }} --quiet
          git checkout FETCH_HEAD -- content/posted.json content/failed.json 2>/dev/null || true
          echo "posted:"; cat content/posted.json
      - name: Publish due / run mode
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.post == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "due" ]; then
            python automation/publisher.py --due
          elif [ "$MODE" = "check" ]; then
            python automation/publisher.py --check
          else
            python automation/publisher.py --slug "$MODE"
          fi
      # always(): a run that failed AFTER publishing still must record the post, or
      # it re-posts on the next cron. This step is the thing that keeps that true.
      - name: Record what was posted (permanent log)
        if: always()
        run: python automation/commit_logs.py ${{ github.event.repository.default_branch }}
