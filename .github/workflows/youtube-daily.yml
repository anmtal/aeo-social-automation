name: The AEO Loop YouTube daily

# Posts one pre-rendered reel/day to YouTube (music + city hashtags) and stages
# content/ig-today.* for the founder to download for the evening Instagram post.
# Laptop-free — renders nothing (uses the committed reels in content/reels-mp4).
# GitHub cron is unreliable; a cron-job.org backup should also hit workflow_dispatch.
on:
  schedule:
    - cron: "7 18 * * *"     # 18:07 UTC = ~2:07 PM ET (summer); afternoon slot
  workflow_dispatch:
    inputs:
      dry:
        description: "true = validate auth + assets without posting"
        # Must stay "false": the documented cron-job.org backup trigger dispatches with
        # no inputs, and a "true" default made that backup validate and post nothing
        # while still reporting green.
        default: "false"

permissions:
  contents: write

concurrency:
  group: aeo-youtube-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # fresh tip, so a serialized 2nd trigger sees today's ig-today.json guard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-api-python-client google-auth
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Post next reel + stage IG copy
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          REELS_DIR: content/reels-mp4
          YOUTUBE_MUSIC: assets/aeo-ambient.mp3
          YOUTUBE_PRIVACY: public
          YT_DRY: ${{ github.event.inputs.dry }}
        run: python automation/youtube_ci.py
      - name: Commit posted log + today's IG file
        if: ${{ github.event.inputs.dry != 'true' }}
        run: |
          set -e
          git config user.name "aeo-bot"
          git config user.email "bot@theaeoloop.com"
          git add content/youtube-posted.json content/ig-today.mp4 content/ig-today.txt content/ig-today.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            # Commit FIRST, then rebase+push — rebasing with staged changes fails and
            # silently skipped the push, so state never persisted. Retry push on races.
            git commit -m "youtube: daily post + stage IG copy [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then echo "pushed"; break; fi
              echo "push attempt $i failed; retrying"; sleep 3
            done
          fi
